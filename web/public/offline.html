<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#082d70" />
    <title>Sin conexion | Boca Players</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f6fb;
        color: #17243b;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.25rem;
        place-items: center;
      }

      main {
        width: min(100%, 34rem);
        padding: clamp(1.5rem, 6vw, 2.5rem);
        border: 1px solid #dce3ef;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 12px 35px rgb(11 34 77 / 8%);
      }

      .brand {
        color: #082d70;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.75rem 0;
        color: #061f4f;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.05;
      }

      p {
        color: #64718a;
        line-height: 1.6;
      }

      button {
        min-height: 2.75rem;
        margin-top: 0.75rem;
        padding: 0.65rem 1rem;
        border: 0;
        border-radius: 0.55rem;
        background: #082d70;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:focus-visible {
        outline: 3px solid #bd8500;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Boca Players</p>
      <h1>Estas sin conexion.</h1>
      <p>
        No pudimos abrir esta pagina porque no hay internet. Cuando recuperes la
        conexion, podes volver a cargar el plantel.
      </p>
      <button onclick="location.reload()" type="button">Intentar de nuevo</button>
    </main>
  </body>
</html>
